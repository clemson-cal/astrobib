# Build and publish astrobib wheels (maturin `bindings = "bin"`: the compiled
# Rust binary packaged as the `astrobib` entry point, so `pipx install
# astrobib` works).
#
# - Pull requests: build + test only (cargo test, then a maturin wheel build).
# - Pushing a `v*` tag: builds wheels for macOS (aarch64, x86_64) and
#   manylinux (x86_64, aarch64) plus an sdist, then publishes to PyPI.
#
# Publishing requires a repository secret named PYPI_API_TOKEN holding a PyPI
# API token with upload permission for the `astrobib` project (Settings ->
# Secrets and variables -> Actions). Without it the publish job fails and
# nothing is uploaded.

name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  # Plain build + test, runs on pull requests only.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --release
      - name: maturin build
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          manylinux: auto

  wheels:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
