[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "astrobib"
version = "0.8.1"
description = "ADS-native literature manager for astrophysics: search, BibTeX libraries, manuscripts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Jonathan Zrake", email = "jzrake@clemson.edu" },
]
keywords = [
    "astronomy",
    "astrophysics",
    "bibliography",
    "bibtex",
    "latex",
    "literature",
    "tui",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://github.com/clemson-cal/astrobib"
Repository = "https://github.com/clemson-cal/astrobib"
Issues = "https://github.com/clemson-cal/astrobib/issues"

[tool.maturin]
bindings = "bin"
