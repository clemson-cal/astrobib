[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litbot"
version = "0.1.0"
description = "Computational Astrophysics Lab literature manager"
requires-python = ">=3.11"
dependencies = [
    "ads>=0.12",
    "bibtexparser>=1.4,<2",
    "click>=8",
    "httpx>=0.27",
    "rich>=13",
    "textual>=0.60",
]

[project.scripts]
litbot = "litbot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["litbot*"]

[tool.setuptools.package-data]
litbot = ["help.md"]
