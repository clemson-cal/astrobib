[package]
name = "astrobib"
version = "0.0.1"
edition = "2021"
description = "ADS-native BibTeX library manager (Rust port)"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
regex = "1"
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-properties = "0.1"

[profile.release]
lto = true
strip = true
