[package]
name = "astrobib"
version = "0.17.0"
edition = "2021"
description = "ADS-native literature manager for astrophysics: search, BibTeX libraries, manuscripts"
license = "MIT"
repository = "https://github.com/clemson-cal/astrobib"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colorous = "1.0.16"
indexmap = "2"
libc = "0.2"
ratatui = "0.29"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tui-input = "0.11"
unicode-normalization = "0.1"
unicode-properties = "0.1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
# tests/glyphs.rs asks the same width table ratatui lays frames out with.
# Pinned to ratatui 0.29's own `=0.2.0` so the two can never diverge into
# separate copies with different answers.
unicode-width = "=0.2.0"

[profile.release]
lto = true
strip = true
